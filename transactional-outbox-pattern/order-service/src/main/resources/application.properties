spring.application.name=order-service
server.port=9191

# Changed to H2 Driver and In-Memory URL with connection delay fix
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Keeps your SQL logs active in the console
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Changed Dialect from MySQL to H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Retained your custom physical naming strategy rule
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Web dashboard console configuration (Highly recommended for H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
